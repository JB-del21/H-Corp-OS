name: H-CORP LLMOps Immune Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # A GitHub cron UTC-ben fut: 07:00 UTC = 08:00 magyar téli idő (CET), 09:00 nyári idő (CEST).
    # Nyári időszámítás alatt reggel 8-hoz '0 6 * * *' kell.
    - cron: '0 7 * * *'

permissions:
  contents: read

jobs:
  gateway-tests:
    name: Gateway unit tesztek (kulcs nélkül)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/test_gateway.py -v --tb=short

  docker-build:
    name: Docker build ellenőrzés
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t h-corp-sop-bot .

  ai-safety-and-regression:
    name: Promptfoo + Pytest Safety Gate (valódi modellel)
    runs-on: ubuntu-latest
    needs: gateway-tests
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Figyelmeztetés, ha nincs API kulcs
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: echo "::warning::Az OPENAI_API_KEY secret nincs beállítva (vagy fork PR), ezért az LLM tesztek kimaradnak. Ez NEM jelent sikeres AI-auditot."

      - uses: actions/setup-python@v5
        if: ${{ env.OPENAI_API_KEY != '' }}
        with:
          python-version: '3.11'
          cache: 'pip'

      - uses: actions/setup-node@v4
        if: ${{ env.OPENAI_API_KEY != '' }}
        with:
          node-version: '20'

      - name: Python függőségek
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: pip install -r requirements-dev.txt

      - name: Promptfoo kiértékelés (deklaratív)
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: npx --yes promptfoo@0.125.1 eval -c promptfooconfig.yaml --no-progress-bar -o output.html -o results.json

      - name: Pytest guardrail suite (imperatív)
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: pytest tests/test_ai_guardrails.py -v --tb=short

      - name: Promptfoo eredmények feltöltése
        if: ${{ always() && env.OPENAI_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-results
          path: |
            output.html
            results.json
          if-no-files-found: ignore
